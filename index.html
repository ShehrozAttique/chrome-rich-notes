<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notes</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <h1>Notes</h1>
      </header>

      <div id="main-container" class="editor-container collapsed">
        <input type="text" id="note-title" placeholder="Title" />

        <div
          id="editor"
          class="editor-area"
          contenteditable="true"
          placeholder="Take a note..."
        ></div>

        <div class="options toolbar-main sticky-toolbar">
          <button data-command="bold" class="option-button format" title="Bold">
            <b>B</b>
          </button>
          <button
            data-command="italic"
            class="option-button format"
            title="Italic"
          >
            <i>I</i>
          </button>
          <button
            data-command="underline"
            class="option-button format"
            title="Underline"
          >
            <u>U</u>
          </button>
          <button
            data-command="strikethrough"
            class="option-button format"
            title="Strikethrough"
          >
            <s>S</s>
          </button>
          <button
            data-command="superscript"
            class="option-button script"
            title="Superscript"
          >
            X²
          </button>
          <button
            data-command="subscript"
            class="option-button script"
            title="Subscript"
          >
            X₂
          </button>
          <div class="toolbar-divider"></div>
          <button
            data-command="insertOrderedList"
            class="option-button"
            title="Numbered List"
          >
            1.
          </button>
          <button
            data-command="insertUnorderedList"
            class="option-button"
            title="Bulleted List"
          >
            •
          </button>
          <div class="toolbar-divider"></div>
          <button data-command="undo" class="option-button" title="Undo">
            ↶
          </button>
          <button data-command="redo" class="option-button" title="Redo">
            ↷
          </button>
          <div class="toolbar-divider"></div>
          <button class="option-button link-btn" title="Link">🔗</button>
          <button data-command="unlink" class="option-button" title="Unlink">
            🚫
          </button>
          <div class="toolbar-divider"></div>
          <button
            data-command="justifyLeft"
            class="option-button align"
            title="Align Left"
          >
            ⇤
          </button>
          <button
            data-command="justifyCenter"
            class="option-button align"
            title="Align Center"
          >
            ⇹
          </button>
          <button
            data-command="justifyRight"
            class="option-button align"
            title="Align Right"
          >
            ⇥
          </button>
          <button
            data-command="indent"
            class="option-button spacing"
            title="Indent"
          >
            ⇥
          </button>
          <button
            data-command="outdent"
            class="option-button spacing"
            title="Outdent"
          >
            ⇤
          </button>
        </div>

        <div class="editor-actions">
          <button id="save-btn">Save Note</button>
        </div>
      </div>

      <div id="notes-grid" class="notes-grid"></div>
    </div>

    <div id="note-modal" class="modal hidden">
      <div class="modal-content">
        <button id="modal-close" class="close-btn">✕</button>
        <input
          type="text"
          id="modal-title"
          class="modal-title-input"
          placeholder="Title"
        />

        <div
          id="modal-body"
          class="note-content full-view editor-area"
          contenteditable="true"
          placeholder="Note content..."
        ></div>

        <div class="options toolbar-modal sticky-toolbar">
          <button data-command="bold" class="option-button format">
            <b>B</b>
          </button>
          <button data-command="italic" class="option-button format">
            <i>I</i>
          </button>
          <button data-command="underline" class="option-button format">
            <u>U</u>
          </button>
          <button data-command="strikethrough" class="option-button format">
            <s>S</s>
          </button>
          <button data-command="superscript" class="option-button script">
            X²
          </button>
          <button data-command="subscript" class="option-button script">
            X₂
          </button>
          <div class="toolbar-divider"></div>
          <button data-command="insertOrderedList" class="option-button">
            1.
          </button>
          <button data-command="insertUnorderedList" class="option-button">
            •
          </button>
          <div class="toolbar-divider"></div>
          <button data-command="undo" class="option-button">↶</button>
          <button data-command="redo" class="option-button">↷</button>
          <div class="toolbar-divider"></div>
          <button class="option-button link-btn">🔗</button>
          <button data-command="unlink" class="option-button">🚫</button>
          <div class="toolbar-divider"></div>
          <button data-command="justifyLeft" class="option-button align">
            ⇤
          </button>
          <button data-command="justifyCenter" class="option-button align">
            ⇹
          </button>
          <button data-command="justifyRight" class="option-button align">
            ⇥
          </button>
        </div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
